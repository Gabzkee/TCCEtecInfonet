<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estoque.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <title>Estoque</title>
</head>
<body>

    <nav>
   
        
        
        <a href="#" ><i class="fa-solid fa-triangle-exclamation"></i></a>
        <a href="#"><i class="fa-solid fa-coins"></i></a>
        <a href="#"><i class="fa-solid fa-calendar"></i></a>

        <div>
        <input type="text" placeholder="pesquisar" >
        </div>
        <a href="#"><i class="fa-solid fa-gear"></i></a>
        <a href="#" class="notification"><i class="fa-solid fa-bell"></i></a>

        
        <img id="perfil" src="perfil.png" href="#">

        
        
        
    </nav>

    <div class="conteudo">

    <aside>

        <div class="asidec">
            <h2>menu</h2>
        </div>
        
        <div class="processosSeparados">
            <h2>processos de caixa</h2>
            <button class="lateral"> Relatórios</button>
            <button class="lateral"> Mapeamento</button>
            <button class="lateral"> Analise </button>
            <button class="lateral"> Entradas P</button>
        </div>

        <div class="processosSeparados">
            <h2>processos de inventario</h2>
            <button class="lateral"> Saídas P</button>
            <button class="lateral"> Relatório de inventário</button>
            <button class="lateral"> Relatório de caixa</button>
        </div>
        <div class="processosSeparados">
            <h2>processos estoque</h2>
            <button class="lateral"> Analise geral</button>
            <button class="lateral"> Banco de dados</button>
            <button class="lateral"> App </button>
            <button class="lateral"> Calendário </button>
        </div>


      
    </aside>



    

    <main>
    <button class="card">
        <i class="fa-solid fa-boxes-stacked"></i>
        <h4>Balanço de estoque</h4>
    </button>

    <button class="card">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <h4>Histórico de movimentações</h4>
    </button>

    <button class="card">
        <i class="fa-solid fa-box-open"></i>
        <h4>Produtos</h4>
    </button>

    <button class="card">
        <i class="fa-solid fa-truck"></i>
        <h4>Fornecedores</h4>
    </button>

    <button class="card">
        <i class="fa-solid fa-magnifying-glass"></i>
        <h4>Consultar</h4>
    </button>

    <button class="card">
        <i class="fa-solid fa-clipboard-list"></i>
        <h4>Relatório de inventário</h4>
    </button>

    <button class="card">
        <i class="fa-solid fa-warehouse"></i>
        <h4>Locais de armazenamento</h4>
    </button>

    <button class="card">
        <i class="fa-solid fa-users"></i>
        <h4>Funcionários</h4>
    </button>

    <button class="card">
        <i class="fa-solid fa-chart-line"></i>
        <h4>Desempenho</h4>
    </button>

    <button class="card">
        <i class="fa-solid fa-chart-column"></i>
        <h4>Resumo mensal</h4>
    </button>

    </main>


    </div>
    

    
</body>
</html>
