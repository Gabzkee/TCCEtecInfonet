<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Historico.css">
    <title>Histórico de Movimentações</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

    <nav>

        <button onclick="window.location.href='../estoque.html'" id="voltar">
            Voltar
        </button>

        <a href="#" title="Alertas">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </a>

        <a href="Calendario.html">
            <i class="fa-solid fa-calendar"></i>
        </a>

        <div>
            <input type="text" placeholder="Pesquisar" class="pesquisar">
        </div>

        <a href="configuracoes.html">
            <i class="fa-solid fa-gear"></i>
        </a>

       <a  class="notification" onclick="alert('sem notificações')">
            <i class="fa-solid fa-bell"></i>
        </a>

        
        <img id="perfil" src="../perfil.png" onclick="abrirPerfil()">

        <div id="janelaPerfil" class="janela-perfil">

            <span class="fecharPerfil" onclick="fecharPerfil()">X</span>

            <h2>Minha conta</h2>

            <img src="../perfil.png">

            <h3>Nome do usuário</h3>

            <label>Nome de usuário</label>
            <input type="text" value="usuario123" readonly>

            <label>Senha</label>
            <input type="password" value="12345678" readonly>

            <button onclick="sairConta()">Sair da conta</button>

        </div>
        
    </nav>

    <div class="conteudo">

        <aside>

            <div class="asidec">
                <h2>Menu</h2>
            </div>

            <div class="processosSeparados">

                <h2>Processos de caixa</h2>

                <button class="lateral"
                    onclick="window.location.href='../paginasExtras/SaidaP.html'">
                    Saída Produtos
                </button>

            </div>

            <div class="processosSeparados">

                <h2>Processos de inventário</h2>

                <button class="lateral"
                    onclick="window.location.href='EntradaP.html'">
                    Entrada Produtos
                </button>

                <button class="lateral"
                    onclick="window.location.href='RelatoriosI.html'">
                    Relatório de inventário
                </button>

                <button class="lateral"
                    onclick="window.location.href='Historico.html'">
                    Histórico de movimentações
                </button>

            </div>

            <div class="processosSeparados">

                <h2>Processos estoque</h2>

                <button class="lateral"
                    onclick="window.location.href='AnaliseGeral.html'">
                    Análise geral
                </button>

                <button class="lateral"
                    onclick="window.location.href='App.html'">
                    App
                </button>

                <button class="lateral"
                    onclick="window.location.href='Calendario.html'">
                    Calendário
                </button>

            </div>
        </aside>

        <main>
            <header>
                <h1>Histórico de Movimentações</h1>
            </header>

            <section id="Mov">

                <div class="movimentacao">

                    <h2>Kit Kat</h2>
                    <p class="entrada">Entrada</p>
                    <p class="qt">Quantidade: 20 unidades</p>

                </div>

                <div class="movimentacao">

                    <h2>Maminha</h2>
                    <p class="saida">Saída</p>
                    <p class="qt">Quantidade: 2 kg</p>

                </div>

                <div class="movimentacao">

                    <h2>Pães</h2>
                    <p class="entrada">Entrada</p>
                    <p class="qt">Quantidade: 50 unidades</p>

                </div>

                <div class="movimentacao">

                    <h2>Queijo</h2>
                    <p class="saida">Saída</p>
                    <p class="qt">Quantidade: 1 bloco</p>

                </div>

            </section>
        </main>

    </div>

        <script>
        
        const janelaPerfil = document.getElementById("janelaPerfil");

            function abrirPerfil() {
                janelaPerfil.classList.add("aberto");
            }

            function fecharPerfil() {
                janelaPerfil.classList.remove("aberto");
            }

            function sairConta() {
                window.location.href = "../login.html";
            }

    </script>

</body>
</html>
