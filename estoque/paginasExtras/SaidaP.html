<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Saida de Produtos</title>
    <link rel="stylesheet" href="saidaP.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <nav>

        <button onclick="window.location.href='../estoque.html'"
                    id="voltar">
                    Voltar
        </button>

        <a href="#" title="Alertas">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </a>

        <a href="Calendario.html">
            <i class="fa-solid fa-calendar"></i>
        </a>

        <div>
            <input type="text" placeholder="Pesquisar" class="pesquisar">
        </div>

        <a href="configuracoes.html">
            <i class="fa-solid fa-gear"></i>
        </a>

        <a href="Notificacoes.html" class="notification">
            <i class="fa-solid fa-bell"></i>
        </a>

        <img id="perfil" src="../perfil.png" alt="Perfil">
    </nav>

    <div class="conteudo">

        <aside>

            <div class="asidec">
                <h2>Menu</h2>
            </div>

            <div class="processosSeparados">

                <h2>Processos de caixa</h2>

                <button class="lateral"
                    onclick="window.location.href='../paginasExtras/SaidaP.html'">
                    Saída Produtos
                </button>

            </div>

            <div class="processosSeparados">

                <h2>Processos de inventário</h2>
                
                <button class="lateral"
                    onclick="window.location.href='EntradaP.html'">
                    Entrada Produtos
                </button>

                <button class="lateral"
                    onclick="window.location.href='RelatoriosI.html'">
                    Relatório de inventário
                </button>
            </div>

            <div class="processosSeparados">

                <h2>Processos estoque</h2>

                <button class="lateral"
                    onclick="window.location.href='AnaliseGeral.html'">
                    Análise geral
                </button>

                <button class="lateral"
                    onclick="window.location.href='App.html'">
                    App
                </button>

                <button class="lateral"
                    onclick="window.location.href='Calendario.html'">
                    Calendário
                </button>

            </div>
        </aside>

    

        <div class="corpo">
            <button id="abrirFiltro" class="abrir-filtro">
                ☰ Filtros
            </button>
            
            <div class="filtroM">
                
            <label> <input type="checkbox" name="categoria" data-categoria="todos" onchange="check()"> Todos </label>
            <label> <input type="checkbox" name="categoria" data-categoria="acougue" onchange="check()"> Açougue </label>
            <label> <input type="checkbox" name="categoria" data-categoria="mercearia" onchange="check()"> Mercearia </label>
            <label> <input type="checkbox" name="categoria" data-categoria="frios" onchange="check()"> Frios </label>
            <label> <input type="checkbox" name="categoria" data-categoria="padaria" onchange="check()"> Padaria </label>
        
            </div>

            <main id="produtosM">

                <div class="produtos" data-categoria="padaria"> <h3> 12 pães</h3> <h5>padaria</h5> </div>
                <div class="produtos" data-categoria="acougue"> <h3> 2kg Maminha</h3> <h5>Açougue</h5> </div>
                <div class="produtos" data-categoria="frios"> <h3> 1 Bloco de queijo</h3> <h5>frios</h5> </div>
                <div class="produtos" data-categoria="mercearia"> <h3> 3 kit kat</h3> <h5>mercearia</h5> </div>
            </main>
        </div>
    </div>

    <script src="saida.js"></script>
</body>
</html>
